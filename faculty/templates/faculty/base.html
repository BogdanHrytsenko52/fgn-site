<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Факультет гуманітарних наук{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #172033;
        }

        header {
            background: #172033;
            padding: 20px;
        }

        nav {
            max-width: 1100px;
            margin: auto;
            display: flex;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #9ec5ff;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 36px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .07);
        }

        a {
            color: #2457a6;
        }

        .muted {
            color: #667085;
        }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="{% url 'home' %}">Головна</a>
        <a href="{% url 'departments' %}">Кафедри</a>
        <a href="{% url 'programs' %}">Спеціальності</a>
        <a href="{% url 'exchange' %}">Академічний обмін</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
